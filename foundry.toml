[profile.default]
src = "src"
out = "out"
libs = ["lib"]

[profile.default.fuzz]
runs = 256
# Allows Foundry to ignore/discard more fuzz runs triggered by vm.assume() without aborting
max_test_rejects = 1000000

[profile.default.invariant]
# Ignores reverting calls during stateful fuzz runs instead of failing the test
fail_on_revert = false
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
